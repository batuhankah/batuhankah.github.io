<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo · Karanlıkta tek ışık sensin</title>
<meta name="description" content="Lumo: gölgeleri ışığınla erittiğin uzay aksiyon oyunu. Yakında Google Play'de, ücretsiz.">
<meta property="og:title" content="Lumo · Karanlıkta tek ışık sensin">
<meta property="og:description" content="Gölgeleri ışığınla erit, 18 sektörü kurtar. Yakında Google Play'de, ücretsiz.">
<meta property="og:image" content="assets/feature-graphic.png">
<link rel="icon" href="assets/play-icon-512.png">
<style>
  /* Bio linki sayfası: TikTok / Instagram / YouTube profilindeki tek link buraya gelir.
     DEĞİŞTİR yazan linkleri hesaplar ve test linki hazır olunca doldur. */
  :root{--bg:#0b0e1a;--card:#141a33;--line:#2a3360;--txt:#e8eeff;--mute:#9aa6cc;--accent:#ffd76a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#26306a 0%,#121736 45%,var(--bg) 100%);color:var(--txt);
       font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:32px 16px 48px}
  main{width:100%;max-width:440px;text-align:center}
  .icon{width:112px;height:112px;border-radius:26px;box-shadow:0 0 48px #ffd76a55}
  h1{margin:14px 0 2px;font-size:44px;letter-spacing:.18em;color:var(--accent);text-shadow:0 0 24px #ffd76a66}
  .tag{margin:0 0 6px;font-weight:700}
  .sub{margin:0 0 24px;color:var(--mute);font-size:14px}
  a.btn{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:14px 16px;margin:10px 0;font-weight:700;text-align:left;transition:transform .1s,border-color .1s}
  a.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  a.btn small{display:block;font-weight:500;color:var(--mute);font-size:13px}
  a.btn .e{font-size:24px;width:32px;text-align:center}
  a.main{background:var(--accent);color:#1a1405;border-color:var(--accent);box-shadow:0 0 32px #ffd76a55}
  a.main small{color:#5a4a14}
  a.off{opacity:.55;pointer-events:none}
  .row{display:flex;gap:10px}.row a.btn{flex:1;justify-content:center}
  .shots{display:flex;gap:8px;overflow-x:auto;margin:22px -16px 8px;padding:0 16px;scroll-snap-type:x mandatory}
  .shots img{height:260px;border-radius:14px;border:1px solid var(--line);scroll-snap-align:center}
  footer{margin-top:22px;color:var(--mute);font-size:13px}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/play-icon-512.png" alt="Lumo ikonu">
  <h1>LUMO</h1>
  <p class="tag">Karanlıkta tek ışık sensin.</p>
  <p class="sub">Gölgeleri ışığınla erit, 18 sektörü kurtar. Ücretsiz · Android</p>

  <!-- DEĞİŞTİR: kapalı test linki hazır olunca href ekle ve class="btn main" yap -->
  <a class="btn main off" id="testLink"><span class="e">🧪</span><span>Kapalı test<small>Yakında: ilk oynayanlardan ol</small></span></a>
  <!-- DEĞİŞTİR: yayına girince class="btn" yap; link oyunun Play sayfası -->
  <a class="btn off" href="https://play.google.com/store/apps/details?id=com.lumogame.app"><span class="e">▶</span><span>Google Play<small>Yakında</small></span></a>

  <div class="shots">
    <img src="assets/store/tr/1-isik.png" alt="Karanlıkta tek ışık sensin">
    <img src="assets/store/tr/2-flas.png" alt="Flaşla gölgeleri sersemlet">
    <img src="assets/store/tr/3-boss.png" alt="Dev bosslar">
    <img src="assets/store/tr/4-silah.png" alt="Işık silahları">
    <img src="assets/store/tr/6-kiyafet.png" alt="Robot kıyafetleri">
  </div>

  <!-- sosyal medya hesapları açılınca buraya eklenecek (TikTok, Instagram, YouTube, Discord) -->

  <footer>
    <a href="presskit.html">Basın kiti</a> · <a href="gizlilik.html">Gizlilik</a> · <a href="privacy.html">Privacy</a>
  </footer>
</main>
</body>
</html>
